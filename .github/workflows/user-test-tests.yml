name: user-test tests

on:
  pull_request:
    paths:
      - "skills/user-test/scripts/**"
      - "skills/user-test/tests/**"
      - ".github/workflows/user-test-tests.yml"
  push:
    branches: [main]
    paths:
      - "skills/user-test/scripts/**"
      - "skills/user-test/tests/**"
      - ".github/workflows/user-test-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Byte-compile the helper
        run: python3 -m py_compile skills/user-test/scripts/user_test.py

      - name: Run unit tests (temp dirs and local processes, no network)
        run: |
          cd skills/user-test
          python3 -m unittest discover -s tests -p 'test_*.py' -v
